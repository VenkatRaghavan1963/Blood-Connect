{% extends 'base.html' %}{% block title %}{{ 'Edit camp' if camp else 'Add camp' }}{% endblock %}{% block content %}<section class="page-header compact"><div class="container"><div class="eyebrow">Admin workspace</div><h1>{{ 'Edit camp details' if camp else 'Publish a new camp' }}</h1><p>Keep dates, contact details, and map coordinates accurate for donors.</p></div></section><section class="section-pad pt-0"><div class="container"><form method="post" class="form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-8"><label>Camp name *</label><input class="form-control" name="camp_name" required value="{{ camp.camp_name if camp else '' }}"></div><div class="col-md-4"><label>Organizer name *</label><input class="form-control" name="organizer_name" required value="{{ camp.organizer_name if camp else '' }}"></div><div class="col-md-4"><label>Date *</label><input type="date" class="form-control" name="date" required value="{{ camp.date.isoformat() if camp else '' }}"></div><div class="col-md-4"><label>Start time *</label><input type="time" class="form-control" name="start_time" required value="{{ camp.start_time if camp else '' }}"></div><div class="col-md-4"><label>End time *</label><input type="time" class="form-control" name="end_time" required value="{{ camp.end_time if camp else '' }}"></div><div class="col-md-6"><label>Blood groups needed *</label><input class="form-control" name="blood_groups_needed" placeholder="O+, A+, B+" required value="{{ camp.blood_groups_needed if camp else '' }}"></div><div class="col-md-6"><label>Contact number *</label><input class="form-control" name="contact_number" required value="{{ camp.contact_number if camp else '' }}"></div><div class="col-md-8"><label>Camp address *</label><input class="form-control" name="address" required value="{{ camp.address if camp else '' }}"></div><div class="col-md-4"><label>City *</label><input class="form-control" name="city" required value="{{ camp.city if camp else '' }}"></div><div class="col-md-6"><label>Latitude *</label><input type="number" step="any" min="-90" max="90" class="form-control" name="latitude" required value="{{ camp.latitude if camp else '' }}"></div><div class="col-md-6"><label>Longitude *</label><input type="number" step="any" min="-180" max="180" class="form-control" name="longitude" required value="{{ camp.longitude if camp else '' }}"></div><div class="col-12"><label>Camp description *</label><textarea class="form-control" name="description" rows="4" required>{{ camp.description if camp else '' }}</textarea></div></div><div class="form-actions mt-4"><a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn btn-primary" type="submit">{{ 'Save changes' if camp else 'Publish camp' }} <i class="bi bi-arrow-right ms-2"></i></button></div></form></div></section>{% endblock %}
